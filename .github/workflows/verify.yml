name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: make check-harness check-tools

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: golang:1.25.8-bookworm
    env:
      GOWORK: 'off'
      GOPROXY: https://proxy.golang.org,direct
      CGO_ENABLED: '1'
    services:
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: storekit
      mysql:
        image: mysql:8.2@sha256:212fe73edca5df6ff14826d5eb975c914bfb91f82a2e923f9050568f99525da1
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: storekit
      clickhouse:
        image: clickhouse/clickhouse-server:26.2-alpine@sha256:c6ad6a7eb2fb5999df3adfb8b69a0c7222c68fa9b8f6b04a088564ebbc959251
        env:
          CLICKHOUSE_USER: fixture
          CLICKHOUSE_PASSWORD: fixture-only
          CLICKHOUSE_DB: storekit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
      - run: make test-integration-ci
